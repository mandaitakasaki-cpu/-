<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>景品ルーレット</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#222b39;font-family:system-ui,sans-serif}main{max-width:720px;margin:32px auto;padding:24px;text-align:center}h1{font-size:28px;margin:0 0 8px}.sub{color:#687386;margin:0 0 28px}.stage{position:relative;width:min(100%,440px);margin:auto}.pointer{position:absolute;top:-7px;left:calc(50% - 15px);border-left:15px solid transparent;border-right:15px solid transparent;border-top:31px solid #202b3c;z-index:1}canvas{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 15px #17203318)}button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:15px 30px;background:#253f67;color:white;font-weight:700}button:disabled{opacity:.55;cursor:wait}#spin{font-size:21px;min-width:240px;margin:24px 0 12px}#result{font-size:32px;font-weight:800;min-height:50px;margin:8px}details{background:white;border:1px solid #e0e5eb;border-radius:12px;padding:18px;margin-top:24px;text-align:left}summary{cursor:pointer;font-weight:700}table{width:100%;border-collapse:collapse;margin:16px 0}th,td{text-align:left;padding:7px}input{font:inherit;width:100%;padding:9px;border:1px solid #cbd2dc;border-radius:6px}input[type=number]{width:95px}#error{color:#b42318}.secondary{background:white;color:#253f67;border:1px solid #cbd2dc;padding:10px 18px}footer{font-size:13px;color:#687386;margin-top:24px}@media(max-width:480px){main{padding:16px;margin:16px auto}th,td{padding:5px}input[type=number]{width:75px}}@media(prefers-reduced-motion:reduce){canvas{filter:none}}
</style>
<main><h1>景品ルーレット</h1><p class="sub">ボタンを押して、抽選スタート</p>
<div class="stage"><div class="pointer"></div><canvas id="wheel" width="880" height="880" aria-label="景品の当選確率を表したルーレット"></canvas></div>
<button id="spin">スタート</button><p id="result" role="status" aria-live="polite">準備OK</p><button id="fullscreen" class="secondary">全画面表示</button>
<details id="settings"><summary>景品・当選確率の設定</summary><p>合計が100％になるように設定してください。</p><table><thead><tr><th>景品名</th><th>当選確率（％）</th></tr></thead><tbody id="rows"></tbody></table><p id="error" role="alert"></p><button id="save">設定を保存</button></details>
<footer>抽選は毎回独立しています。100回で必ず設定どおりの個数になるわけではありません。<br>設定はこのブラウザに保存されます。</footer></main>
<script>
'use strict';
const defaults=[{name:'A賞',weight:5},{name:'B賞',weight:15},{name:'C賞',weight:30},{name:'はずれ',weight:50}];
const colors=['#e9bf56','#78a4cf','#89bea8','#dce1e8'];
const TAU=Math.PI*2;const canvas=document.querySelector('#wheel'),ctx=canvas.getContext('2d'),spin=document.querySelector('#spin'),result=document.querySelector('#result');
function valid(a){return Array.isArray(a)&&a.length===4&&a.every(p=>typeof p.name==='string'&&p.name.trim().length>0&&p.name.length<=24&&Number.isFinite(p.weight)&&p.weight>=0)&&Math.abs(a.reduce((s,p)=>s+p.weight,0)-100)<1e-8}
let prizes=defaults.map(p=>({...p}));try{const saved=JSON.parse(localStorage.getItem('prize-roulette-v1'));if(valid(saved))prizes=saved}catch{}
let rotation=0,busy=false;
function draw(){ctx.clearRect(0,0,880,880);let start=-Math.PI/2+rotation;prizes.forEach((p,i)=>{const arc=p.weight/100*TAU;if(!arc)return;ctx.beginPath();ctx.moveTo(440,440);ctx.arc(440,440,418,start,start+arc);ctx.closePath();ctx.fillStyle=colors[i];ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.stroke();ctx.save();ctx.translate(440,440);ctx.rotate(start+arc/2);ctx.fillStyle='#253045';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 29px system-ui';const label=p.name+' '+p.weight+'%';ctx.fillText(label,285,0,Math.max(45,Math.min(235,arc*285*.85)));ctx.restore();start+=arc});ctx.beginPath();ctx.arc(440,440,66,0,TAU);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle='#253f67';ctx.font='bold 22px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('抽選',440,440)}
function randomUnit(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296}
function choose(u){let total=0;for(let i=0;i<prizes.length;i++){total+=prizes[i].weight;if(u*100<total)return i}return prizes.findLastIndex(p=>p.weight>0)}
spin.addEventListener('click',()=>{if(busy)return;busy=true;spin.disabled=true;document.querySelector('#settings').open=false;document.querySelectorAll('#settings input,#save').forEach(e=>e.disabled=true);result.textContent='抽選中…';const selected=choose(randomUnit());const before=prizes.slice(0,selected).reduce((s,p)=>s+p.weight,0);const inside=(before+prizes[selected].weight*(.15+.7*randomUnit()))/100*TAU;const normalized=((rotation%TAU)+TAU)%TAU;const destination=(TAU-inside)%TAU;const delta=((destination-normalized+TAU)%TAU)+TAU*6;const initial=rotation;const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?100:4200;const started=performance.now();function frame(now){const t=Math.min(1,(now-started)/duration);rotation=initial+delta*(1-Math.pow(1-t,4));draw();if(t<1){requestAnimationFrame(frame)}else{rotation=destination;draw();result.textContent=prizes[selected].name;busy=false;spin.disabled=false;document.querySelectorAll('#settings input,#save').forEach(e=>e.disabled=false)}}requestAnimationFrame(frame)});
const rows=document.querySelector('#rows');prizes.forEach((p,i)=>{const tr=document.createElement('tr');const td=document.createElement('td'),tw=document.createElement('td');const name=document.createElement('input'),weight=document.createElement('input');name.value=p.name;name.maxLength=24;name.setAttribute('aria-label','景品'+(i+1)+'の名前');weight.type='number';weight.min=0;weight.max=100;weight.step='0.1';weight.value=p.weight;weight.setAttribute('aria-label','景品'+(i+1)+'の当選確率');td.append(name);tw.append(weight);tr.append(td,tw);rows.append(tr)});
document.querySelector('#save').addEventListener('click',()=>{if(busy)return;const next=[...rows.children].map(tr=>({name:tr.children[0].firstChild.value.trim(),weight:tr.children[1].firstChild.value.trim()===''?NaN:Number(tr.children[1].firstChild.value)}));const error=document.querySelector('#error');if(!valid(next)){error.textContent='景品名を入力し、当選確率を0〜100％・合計100％にしてください。';return}prizes=next;rotation=0;draw();result.textContent='準備OK';try{localStorage.setItem('prize-roulette-v1',JSON.stringify(prizes));error.textContent='保存しました。'}catch{error.textContent='設定を反映しました。このブラウザでは保存できないため、閉じると元に戻ります。'}});
document.querySelector('#fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{result.textContent='全画面表示に対応していません。'}});document.addEventListener('fullscreenchange',()=>document.querySelector('#fullscreen').textContent=document.fullscreenElement?'全画面を終了':'全画面表示');draw();
</script></html>
